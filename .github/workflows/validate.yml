name: Validate Theealux dataset
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/items.json'
      - 'scripts/validate-dataset.mjs'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-dataset.mjs
