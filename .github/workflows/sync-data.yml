name: Sync real Ngôi Sao Thời Trang data

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync-annie.mjs'
      - '.github/workflows/sync-data.yml'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/sync-annie.mjs
      - name: Validate verified source data
        run: node scripts/validate-dataset.mjs
      - name: Commit verified source data
        run: |
          git config user.name 'Theealux Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/items.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: sync real item data from Annie'
          git push
