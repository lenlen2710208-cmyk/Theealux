name: Aetheria integrity layer

on:
  push:
    paths:
      - 'rank-guard.js'
      - 'index.html'
      - 'app.js'
      - 'data/stages.json'
      - 'data/stages-extra.json'
      - '.github/workflows/integrity-layer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-integrity-layer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply Aetheria integrity UI
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          # Cache-busted script URLs are intentional; accept both plain and ?v= forms.
          has_guard=bool(re.search(r'<script\s+src=["\']rank-guard\.js(?:\?[^"\']*)?["\']', text))
          if not has_guard:
              marker=re.search(r'<script\s+src=["\']app\.js(?:\?[^"\']*)?["\']></script>', text)
              if not marker:
                  raise SystemExit('app.js script tag not found')
              insert=marker.group(0)+'\n<script src="rank-guard.js"></script>'
              text=text[:marker.start()]+insert+text[marker.end():]
          text=text.replace('Nhiều nguồn được đối chiếu; tên, thuật ngữ và hình ảnh sẽ ghi rõ nguồn tham khảo khi hiển thị.','Dữ liệu được đối chiếu từ nhiều nguồn; danh sách nguồn tham khảo & hình ảnh được tập trung tại mục Nguồn.')
          p.write_text(text, encoding='utf-8')

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Refine Aetheria data-source messaging"
            git push
          fi
