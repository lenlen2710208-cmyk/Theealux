name: Enrich all item metadata

on:
  push:
    branches: [main]
    paths:
      - 'data/items.json'
      - 'scripts/enrich-item-attributes.mjs'
      - '.github/workflows/enrich-item-attributes.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 1'

permissions:
  contents: write

concurrency:
  group: aetheria-item-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Enrich complete item metadata')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enrich attributes, suits and tags
        env:
          CONCURRENCY: 16
          TIMEOUT: 25000
          MAX_RETRIES: 4
        run: node scripts/enrich-item-attributes.mjs

      - name: Validate enriched file
        run: |
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('data/items-enriched.json','utf8'));const a=Array.isArray(x)?x:x.items;if(!Array.isArray(a)||a.length<30000)throw new Error('Enriched dataset is unexpectedly small');console.log('enriched items:',a.length)"

      - name: Commit enriched catalog
        run: |
          git config user.name "Aetheria Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items-enriched.json
          if git diff --cached --quiet; then
            echo "No metadata changes."
          else
            git commit -m "Enrich complete item metadata"
            git push
          fi
