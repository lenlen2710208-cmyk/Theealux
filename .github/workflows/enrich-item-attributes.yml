name: Enrich all item attributes

on:
  push:
    branches: [main]
    paths:
      - 'data/items.json'
      - 'scripts/enrich-item-attributes.mjs'
      - '.github/workflows/enrich-item-attributes.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 1'

permissions:
  contents: write

concurrency:
  group: aetheria-attribute-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Enrich item attributes')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan every item page
        env:
          CONCURRENCY: 16
          TIMEOUT: 20000
        run: node scripts/enrich-item-attributes.mjs

      - name: Commit attribute catalog
        run: |
          git config user.name "Aetheria Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/item-attribute-grades.json
          if git diff --cached --quiet; then
            echo "No attribute changes."
          else
            git commit -m "Enrich item attributes"
            git push
          fi
